name: 每日盤後自動更新籌碼

on:
  schedule:
    # 台灣時間每天下午 16:30 執行 (UTC時間 08:30)
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 允許你隨時手動按按鈕測試

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案檔案
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝需要的小工具
        run: pip install -r twse-dashboard/requirements.txt

      - name: 執行爬蟲更新 data.json
        run: python twse-dashboard/update.py

      - name: 自動存檔回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Auto Update Bot"
          git add twse-dashboard/data.json
          git commit -m "自動更新每日籌碼數據" || exit 0
          git pull --rebase origin main
          git push
